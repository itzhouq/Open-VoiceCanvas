name: db-count
on:
  workflow_dispatch:
permissions: {}
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: inspect db (read-only)
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "== current db =="
          psql "$PROD_DATABASE_URL" -t -A -c "SELECT current_database(), current_user;"
          echo "== tables =="
          psql "$PROD_DATABASE_URL" -t -A -F'|' -c "SELECT table_schema, table_name FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema') ORDER BY 1,2;"
          echo "== databases =="
          psql "$PROD_DATABASE_URL" -t -A -c "SELECT datname FROM pg_database WHERE NOT datistemplate ORDER BY 1;"
